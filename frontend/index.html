<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English to Darija Translator</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="shortcut icon" href="data:;" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>English to Darija Translator</h1>
            <p>Translate English text to Moroccan Arabic Dialect</p>
            <div class="auth-buttons">
                <a href="login" class="auth-btn login-btn">Login</a>
                <a href="signup" class="auth-btn signup-btn">Sign Up</a>
            </div>
            <div class="user-menu">
                <div class="user-avatar" id="userAvatar">G</div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="settings">Settings</a>
                    <a href="#logout" id="logout-btn">Logout</a>
                </div>
            </div>
        </div>

        <div class="translator-box">
            <div class="input-section">
                <div class="section-label">
                    <span>English</span>
                </div>
                <textarea 
                    id="inputText" 
                    placeholder="Enter English text here..."
                    maxlength="5000"
                ></textarea>
                <div class="char-count">
                    <span id="charCount">0</span> / 5000
                </div>
            </div>

            <div class="output-section">
                <div class="section-label">
                    <span>Darija (الدارجة)</span>
                </div>
                <textarea 
                    id="outputText" 
                    placeholder="Translation will appear here..."
                    readonly
                ></textarea>
                <div class="action-btns">
                    <button class="speaker-btn" id="speakerBtn" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume2-icon lucide-volume-2"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
                    </button>
                    <button class="copy-btn" id="copyBtn" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                </div>
                
            </div>
        </div>

        <div class="button-group actions">
            <button class="translate-btn" id="translateBtn">
                Translate
            </button>
            <button class="clear-btn" id="clearBtn">
                Clear
            </button>
        </div>

        <div class="loading" id="loading">
            <span class="spinner"></span>
            Translating...
        </div>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script src="./js/index.js"></script>
</body>
</html>
