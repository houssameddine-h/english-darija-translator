<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="../css/settings.css">
</head>
<body>
    <div class="container">
        <h2>Settings</h2>
        <div class="settings-form">
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" value="Guest User" readonly>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="guest@example.com" readonly>
            </div>
            <div class="input-group">
                <label for="api-key">Gemini API Key</label>
                <input type="password" id="api-key" name="api-key" placeholder="Enter your API key">
            </div>
            <button type="submit">Save</button>
        </div>
        <p><a href="..">Back to Home</a></p>
    </div>
</body>
</html>
